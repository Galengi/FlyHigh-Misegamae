<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" id="browser-theme-color" content="#0E1A2B" />
  <meta name="description" content="Fly High · Aplicaciones personales. Portfolio de aplicaciones personales con PASfh como primer proyecto." />
  <link rel="icon" href="./assets/favicon-64.png" type="image/png" />
  <link rel="apple-touch-icon" href="./assets/favicon-192.png" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <title>Fly High · Aplicaciones personales</title>
  <script src="./scripts/catalogo.js" defer></script>
  <script src="./scripts/app.js" defer></script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="terrain terrain-back"></div><div class="terrain terrain-front"></div></div>

  <header class="menubar" aria-label="Barra superior">
    <div class="menus-left">
      <button class="brand-menu" type="button" data-menu="inicio" aria-label="Menú principal" aria-expanded="false" title="Menú principal">
        <img class="nav-brand-logo" src="./assets/flyhigh-logo.webp" alt="" />
      </button>
      <span class="brand-name" id="brand-name">Fly High</span>
      <nav class="desktop-menus" aria-label="Menús del escritorio">
        <button class="menubar-item" type="button" data-menu="archivo" aria-expanded="false">Archivo</button>
        <button class="menubar-item" type="button" data-menu="ver" aria-expanded="false">Ver</button>
        <button class="menubar-item" type="button" data-menu="ventana" aria-expanded="false">Ventana</button>
        <button class="menubar-item" type="button" data-menu="ayuda" aria-expanded="false">Ayuda</button>
      </nav>
    </div>
    <div class="menus-right">
      <div class="theme-picker" role="group" aria-label="Tema del portfolio">
        <button class="theme-option" type="button" data-theme-choice="night" aria-pressed="true" title="Azul Noche Elegante">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"/></svg><span>Noche</span>
        </button>
        <button class="theme-option" type="button" data-theme-choice="dawn" aria-pressed="false" title="Amanecer Radiante">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Amanecer</span>
        </button>
      </div>
      <time id="clock" aria-label="Hora local"></time>
    </div>
    <div class="menu-popover" id="menu-popover" hidden role="menu"></div>
  </header>

  <main class="desktop" id="desktop" aria-label="Escritorio de aplicaciones">
    <div class="desktop-intro brand-hero">
      <div class="hero-brand-mark"><img src="./assets/flyhigh-logo.webp" alt="Emblema de Fly High: pluma en forma de bombilla y destellos" /></div>
      <h1 id="intro-headline">Fly High</h1>
      <p id="intro-tagline">Aplicaciones personales</p>
    </div>
    <section class="desktop-icons" id="desktop-icons" aria-label="Aplicaciones y accesos directos"></section>
    <div id="windows" class="windows" aria-live="off"></div>
  </main>

  <nav class="dock" id="dock" aria-label="Acceso rápido a aplicaciones"></nav>
  <div class="mobile-home-line" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>Esta web necesita JavaScript para abrir las fichas de las aplicaciones.</noscript>
</body>
</html>
